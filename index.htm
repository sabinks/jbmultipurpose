<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Basic Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #0073e6;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
        }
        main {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <h2>About This Page</h2>
        <p>This is a basic HTML5 template with minimal CSS styling included.</p>
        
        <h2>Features</h2>
        <ul>
            <li>Clean and semantic HTML structure</li>
            <li>Basic CSS styling included in the head</li>
            <li>Mobile-responsive layout setup</li>
        </ul>
    </main>

    <footer>
        <p>&copy; 2026 My Basic Webpage</p>
    </footer>

</body>
</html>
